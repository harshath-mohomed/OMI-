<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMI Multiplayer Authorization Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            color-scheme: dark;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #050505;
            font-family: 'Cinzel', serif;
        }

        body {
            position: relative;
            color: #fff;
        }

        .landing-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(1);
            transform: scale(1.03);
            z-index: 0;
            pointer-events: none;
        }

        .landing-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(0, 0, 0, 0.16), rgba(0, 0, 0, 0.72));
            z-index: 0;
            pointer-events: none;
        }

        .screen {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            z-index: 1;
        }

        .screen-shell {
            position: relative;
            width: min(82vw, 420px);
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 0.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 24px;
        }

        .entry-shell {
            width: min(82vw, 420px);
        }

        .entry-title {
            margin: 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.28em;
            font-size: 2rem;
            color: #fff;
        }

        .entry-subtitle {
            margin: 10px 0 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .screen-shell::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 16px;
            pointer-events: none;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .glass-space {
            height: 160px;
        }

        .minimal-input {
            width: 100%;
            background: transparent;
            border: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            padding: 10px 0;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.22em;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            color: #fff;
            outline: none;
        }

        .minimal-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .divider {
            height: 0.5px;
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
        }

        .play-action {
            width: 100%;
            border: 0;
            background: #111;
            border-radius: 12px;
            padding: 14px 16px;
            text-transform: uppercase;
            letter-spacing: 0.28em;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
        }

        .play-action:focus-visible,
        .room-action:focus-visible {
            outline: 1px solid rgba(255, 255, 255, 0.65);
            outline-offset: 3px;
        }

        .lobby-shell {
            position: relative;
            width: min(92vw, 780px);
            background: rgba(26, 26, 26, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 28px 24px 30px;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
        }

        .room-code-badge {
            position: absolute;
            top: 18px;
            left: 22px;
            text-transform: uppercase;
            letter-spacing: 0.24em;
            font-size: 0.72rem;
            color: rgba(255, 255, 255, 0.52);
            z-index: 2;
        }

        .lobby-title {
            margin: 0 0 24px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.36em;
            font-size: clamp(2.25rem, 4vw, 3.4rem);
            font-weight: 700;
            color: #fff;
        }

        .lobby-grid {
            display: grid;
            grid-template-columns: 1fr 1px 1fr;
            align-items: stretch;
            gap: 0;
        }

        .lobby-divider {
            background: rgba(255, 255, 255, 0.22);
            width: 1px;
        }

        .team-panel {
            padding: 16px 16px 14px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
        }

        .team-label {
            margin: 0 0 18px;
            text-transform: uppercase;
            letter-spacing: 0.28em;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
        }

        .team-red .team-label {
            color: #d52b2b;
        }

        .slot-row {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .player-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .avatar-card {
            width: min(18vw, 96px);
            aspect-ratio: 1 / 1;
            background: #2b2b2b;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
        }

        .team-red .avatar-card {
            color: #e11d48;
        }

        .jester-icon {
            width: min(7vw, 42px);
            height: min(7vw, 42px);
            display: block;
            object-fit: contain;
        }

        .slot-status {
            text-transform: lowercase;
            letter-spacing: 0.16em;
            font-size: 0.7rem;
            color: #fff;
        }

        @media (max-width: 720px) {
            .lobby-shell {
                width: min(94vw, 560px);
                padding: 22px 16px 20px;
            }

            .lobby-grid {
                grid-template-columns: 1fr;
            }

            .lobby-divider {
                display: none;
            }

            .team-panel {
                padding: 0;
            }

            .team-panel + .team-panel {
                margin-top: 26px;
                padding-top: 22px;
                border-top: 1px solid rgba(255, 255, 255, 0.16);
            }
        }

        .game-canvas { position: relative; background: radial-gradient(circle, #1a4a25 0%, #0a240f 100%); }
        .card-element { transition: transform 0.3s ease, top 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), left 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); }
    </style>
</head>
<body>

    <img class="landing-bg" src="/src/card_background_2.jpg" alt="" aria-hidden="true">
    <div class="landing-overlay"></div>

    <div id="home-screen" class="screen">
        <div class="screen-shell entry-shell">
            <h1 class="entry-title">OMI</h1>
            <p class="entry-subtitle">Enter your name and room to begin</p>
            <div class="glass-space"></div>
            <input id="input-username" type="text" placeholder="NAME" maxlength="32" class="minimal-input">
            <div class="h-4"></div>
            <input id="input-room" type="text" placeholder="ROOM CODE" maxlength="12" class="minimal-input">
            <div class="h-4"></div>
            <button id="btn-home-play" class="play-action">PLAY</button>
        </div>
    </div>

    <div id="lobby-screen" class="screen hidden">
        <div class="lobby-shell">
            <div id="lobby-room-code" class="room-code-badge">ROOM ----</div>
            <h1 class="lobby-title">LOBBY</h1>
            <div class="lobby-grid">
                <section class="team-panel team-black" aria-label="Team Black">
                    <h2 class="team-label">TEAM BLACK</h2>
                    <div class="slot-row">
                        <div class="player-slot" data-seat="0">
                            <div class="avatar-card">
                                <img class="jester-icon" src="/src/joker_black.png" alt="" aria-hidden="true">
                            </div>
                            <div class="slot-status" id="lobby-seat-0">waiting</div>
                        </div>
                        <div class="player-slot" data-seat="2">
                            <div class="avatar-card">
                                <img class="jester-icon" src="/src/joker_black.png" alt="" aria-hidden="true">
                            </div>
                            <div class="slot-status" id="lobby-seat-2">waiting</div>
                        </div>
                    </div>
                </section>

                <div class="lobby-divider" aria-hidden="true"></div>

                <section class="team-panel team-red" aria-label="Team Red">
                    <h2 class="team-label">TEAM RED</h2>
                    <div class="slot-row">
                        <div class="player-slot" data-seat="1">
                            <div class="avatar-card">
                                <img class="jester-icon" src="/src/joker_red.png" alt="" aria-hidden="true">
                            </div>
                            <div class="slot-status" id="lobby-seat-1">waiting</div>
                        </div>
                        <div class="player-slot" data-seat="3">
                            <div class="avatar-card">
                                <img class="jester-icon" src="/src/joker_red.png" alt="" aria-hidden="true">
                            </div>
                            <div class="slot-status" id="lobby-seat-3">waiting</div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <div id="game-screen" class="hidden w-full h-full flex flex-col">
        <header class="bg-gray-800 p-3 border-b border-gray-700 grid gap-3 lg:grid-cols-[1.2fr_1fr_1fr] lg:items-center">
            <div class="space-y-1">
                <div class="text-xs uppercase tracking-[0.28em] text-gray-400">Connection</div>
                <div>Host: <span id="display-connection-url" class="font-mono text-sm text-cyan-400">auto</span></div>
                <div>Room: <span id="display-room" class="font-mono text-xl text-yellow-400">Waiting...</span></div>
            </div>
            <div class="space-y-2 text-center">
                <div id="display-phase" class="text-sm uppercase tracking-[0.32em] text-gray-300">Lobby</div>
                <div class="flex flex-col gap-1 text-sm lg:text-base">
                    <div><span id="team-a-label" class="font-semibold text-green-400">Team A</span>: <span id="score-team-a" class="font-bold text-green-400">0</span></div>
                    <div><span id="team-b-label" class="font-semibold text-blue-400">Team B</span>: <span id="score-team-b" class="font-bold text-blue-400">0</span></div>
                </div>
            </div>
            <div class="lg:text-right">
                <div class="text-xs uppercase tracking-[0.28em] text-gray-400">Trump</div>
                <div><span id="display-trump" class="font-bold text-xl text-red-500">None</span></div>
            </div>
        </header>

        <main class="flex-1 game-canvas w-full overflow-hidden" id="board-container">
            <div id="seat-top" class="absolute top-4 left-1/2 transform -translate-x-1/2 bg-black/40 px-3 py-1 rounded" data-seat="2">Seat 2 open</div>
            <div id="seat-left" class="absolute left-4 top-1/2 transform -translate-y-1/2 bg-black/40 px-3 py-1 rounded" data-seat="1">Seat 1 open</div>
            <div id="seat-right" class="absolute right-4 top-1/2 transform -translate-y-1/2 bg-black/40 px-3 py-1 rounded" data-seat="3">Seat 3 open</div>
            <div id="seat-bottom" class="absolute bottom-32 left-1/2 transform -translate-x-1/2 bg-black/40 px-3 py-1 rounded border-2 border-yellow-400" data-seat="0">Seat 0 open</div>

            <div id="trick-mat" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-black/20 rounded-full border border-dashed border-white/20"></div>

            <div id="player-hand-container" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 flex space-x-2 min-h-[120px] transition-all"></div>
        </main>
    </div>

    <div id="trump-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="bg-gray-800 p-8 rounded-xl border border-yellow-500 text-center space-y-4">
            <h2 class="text-2xl font-bold text-yellow-400">SELECT TRUMP SUIT</h2>
            <div class="flex space-x-4">
                <button data-suit="HEARTS" class="bg-red-600 hover:scale-105 font-bold py-3 px-6 rounded text-lg">♥ Hearts</button>
                <button data-suit="DIAMONDS" class="bg-red-500 hover:scale-105 font-bold py-3 px-6 rounded text-lg">♦ Diamonds</button>
                <button data-suit="CLUBS" class="bg-gray-700 hover:scale-105 font-bold py-3 px-6 rounded text-lg">♣ Clubs</button>
                <button data-suit="SPADES" class="bg-black hover:scale-105 font-bold py-3 px-6 rounded text-lg">♠ Spades</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="js/client.js"></script>
</body>
</html>
