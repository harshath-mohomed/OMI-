<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMI Multiplayer Authorization Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .game-canvas { position: relative; background: radial-gradient(circle, #1a4a25 0%, #0a240f 100%); }
        .card-element { transition: transform 0.3s ease, top 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), left 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans overflow-hidden w-screen h-screen">

    <div id="lobby-screen" class="flex flex-col items-center justify-center w-full h-full space-y-4">
        <h1 class="text-4xl font-bold tracking-wider text-green-400">SRI LANKAN OMI</h1>
        <div class="bg-gray-800 p-6 rounded-lg shadow-xl flex flex-col space-y-3 w-80">
            <input id="input-username" type="text" placeholder="Enter Username" class="p-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-green-500">
            <input id="input-room" type="text" placeholder="Room Code (Leave blank to create)" class="p-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-green-500 uppercase">
            <button id="btn-join" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded transition">Enter Room Lobby</button>
        </div>
    </div>

    <div id="game-screen" class="hidden w-full h-full flex flex-col">
        <header class="bg-gray-800 p-3 flex justify-between items-center border-b border-gray-700">
            <div>Room: <span id="display-room" class="font-mono text-xl text-yellow-400">----</span></div>
            <div class="flex space-x-6">
                <div>Team A (Seats 0/2): <span id="score-team-a" class="font-bold text-green-400">0</span></div>
                <div>Team B (Seats 1/3): <span id="score-team-b" class="font-bold text-blue-400">0</span></div>
            </div>
            <div>Trump: <span id="display-trump" class="font-bold text-xl text-red-500">None</span></div>
        </header>

        <main class="flex-1 game-canvas w-full overflow-hidden" id="board-container">
            <div id="seat-top" class="absolute top-4 left-1/2 transform -translate-x-1/2 bg-black/40 px-3 py-1 rounded">Waiting...</div>
            <div id="seat-left" class="absolute left-4 top-1/2 transform -translate-y-1/2 bg-black/40 px-3 py-1 rounded">Waiting...</div>
            <div id="seat-right" class="absolute right-4 top-1/2 transform -translate-y-1/2 bg-black/40 px-3 py-1 rounded">Waiting...</div>
            <div id="seat-bottom" class="absolute bottom-32 left-1/2 transform -translate-x-1/2 bg-black/40 px-3 py-1 rounded border-2 border-yellow-400">Waiting...</div>

            <div id="trick-mat" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-black/20 rounded-full border border-dashed border-white/20"></div>

            <div id="player-hand-container" class="absolute bottom-4 left-1/2 transform -translate-x-1/2 flex space-x-2 min-h-[120px] transition-all"></div>
        </main>
    </div>

    <div id="trump-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="bg-gray-800 p-8 rounded-xl border border-yellow-500 text-center space-y-4">
            <h2 class="text-2xl font-bold text-yellow-400">SELECT TRUMP SUIT</h2>
            <div class="flex space-x-4">
                <button data-suit="HEARTS" class="bg-red-600 hover:scale-105 font-bold py-3 px-6 rounded text-lg">♥ Hearts</button>
                <button data-suit="DIAMONDS" class="bg-red-500 hover:scale-105 font-bold py-3 px-6 rounded text-lg">♦ Diamonds</button>
                <button data-suit="CLUBS" class="bg-gray-700 hover:scale-105 font-bold py-3 px-6 rounded text-lg">♣ Clubs</button>
                <button data-suit="SPADES" class="bg-black hover:scale-105 font-bold py-3 px-6 rounded text-lg">♠ Spades</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="js/client.js"></script>
</body>
</html>
